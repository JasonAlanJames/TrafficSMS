services:

  postgres:
    image: postgis/postgis:17-3.5
    container_name: trafficsms-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: trafficsms
      POSTGRES_USER: trafficsms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - trafficsms_postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trafficsms -d trafficsms"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - trafficsms-network

  redis:
    image: redis:7-alpine
    container_name: trafficsms-redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - trafficsms_redis:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - trafficsms-network

  api:
    image: python:3.12-slim
    container_name: trafficsms-api

    working_dir: /app

    restart: unless-stopped

    command: >
      sh -c "
      pip install -r requirements.txt &&
      alembic upgrade head &&
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      "

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env

    environment:
      APP_ENV: production
      PUBLIC_BASE_URL: https://trafficsms.com/api
      FRONTEND_URL: https://trafficsms.com

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "8000:8000"

    networks:
      - trafficsms-network

  web:
    image: node:22-alpine
    container_name: trafficsms-web

    working_dir: /app

    restart: unless-stopped

    env_file:
      - ./frontend/.env.local

    command: >
      sh -c "
      npm install &&
      npm run build &&
      npm run start
      "

    volumes:
      - ./frontend:/app

    depends_on:
      - api

    ports:
      - "3000:3000"

    networks:
      - trafficsms-network

volumes:

  trafficsms_postgres:

  trafficsms_redis:

networks:

  trafficsms-network:
    driver: bridge